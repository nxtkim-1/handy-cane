# Local DB + API:      docker compose --profile local up --build
# Tiger Cloud + API:   set DATABASE_URL in .env, then  docker compose up --build api
services:
  db:
    profiles: [local]
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: smartcane
    ports: ["5433:5432"]
    volumes: ["tsdb:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcane"]
      interval: 3s
      retries: 20
  api:
    build: .
    depends_on:
      db: { condition: service_healthy, required: false }
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-devpass}@db:5432/smartcane}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ random characters)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    ports: ["8000:8000"]
volumes:
  tsdb:
